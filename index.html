<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#126357">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Gentle chair, standing and in-bed exercises for knee and joint pain, in Telugu and English.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="వ్యాయామాలు">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Amma Nanna Exercises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap">
<style>
/* Layout: sticky top bar (text + voice language, sound) · left menu (sections, today's session, grouped exercises with progress) · main view */
:root{
  --bg:#EFF4F1; --surface:#FFFFFF; --sunk:#E3ECE8; --ink:#16211D; --muted:#53635C; --line:#CFDAD5;
  --accent:#126357; --accent-ink:#FFFFFF; --accent-soft:#D3E9E3; --accent-mid:#8CC3B8;
  --mark:#D97F00; --fig:#22312C; --fig-far:#A2B4AD; --prop:#BFCCC6; --prop2:#DAE4DF;
  --warn-bg:#FFF1D2; --warn-ink:#5A4000; --scrim:rgba(10,20,16,.45);
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-te:'Noto Sans Telugu','Nirmala UI','Gautami','Telugu Sangam MN',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17201D; --sunk:#1F2A26; --ink:#E4EDE9; --muted:#9BACA5; --line:#2B3733;
  --accent:#4DB3A3; --accent-ink:#08120F; --accent-soft:#173430; --accent-mid:#2A6A60;
  --mark:#F3A73A; --fig:#E1EBE7; --fig-far:#5C6F68; --prop:#3B4844; --prop2:#27322E;
  --warn-bg:#2D2410; --warn-ink:#F2D699; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17201D; --sunk:#1F2A26; --ink:#E4EDE9; --muted:#9BACA5; --line:#2B3733;
  --accent:#4DB3A3; --accent-ink:#08120F; --accent-soft:#173430; --accent-mid:#2A6A60;
  --mark:#F3A73A; --fig:#E1EBE7; --fig-far:#5C6F68; --prop:#3B4844; --prop2:#27322E;
  --warn-bg:#2D2410; --warn-ink:#F2D699; --scrim:rgba(0,0,0,.6); color-scheme:dark }

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
body.lock{overflow:hidden}
.te{font-family:var(--f-te);line-height:1.65}
.en2{display:block;font-family:var(--f-body);font-size:.74em;font-weight:400;color:var(--muted);line-height:1.35;margin-top:2px}
.sub{font-family:var(--f-body);font-size:.82em;opacity:.72;font-weight:400}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
h1,h2,h3{text-wrap:balance;overflow-wrap:anywhere}
.row>*{min-width:0;max-width:100%}
.seg{max-width:100%}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-inline:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;flex:1 1 240px}
.brand b{font-size:20px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.menuBtn{display:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:46px;min-width:46px;padding:0 12px;cursor:pointer;align-items:center;gap:6px}
.menuBtn svg{width:22px;height:22px}
.tctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.lbl{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:6px}
.lbl .te{text-transform:none;letter-spacing:0;font-size:14px}
.grp{display:inline-flex;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:999px;cursor:pointer;font-size:15px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:700}
.sound{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:44px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.sound svg{width:22px;height:22px;flex:none}
.sound[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}

@media (max-width:700px){
  .top{position:static}
  .topin{gap:8px 10px;padding-block:8px}
  .brand .sub{display:none}
  .brand b{font-size:18px}
  .lbl .sub{display:none}
  .lbl{font-size:12px;margin-right:4px}
  .seg button{padding:6px 10px;font-size:14px;min-height:40px}
  .sound{padding:6px 10px}
  .sound span{display:none}
}
/* shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr)}
.side{position:sticky;top:var(--topH,64px);height:calc(100vh - var(--topH,64px));overflow-y:auto;border-right:1px solid var(--line);padding-inline:12px;padding-block:14px 40px;background:var(--bg)}
.scrim{display:none}
@media (max-width:959px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menuBtn{display:inline-flex}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(330px,88vw);z-index:40;transform:translateX(-104%);transition:transform .25s ease;background:var(--surface);padding-top:calc(env(safe-area-inset-top,0px) + 14px);box-shadow:0 0 30px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:35}
}
.nav{display:grid;gap:4px}
.nav button,.sitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px 12px;cursor:pointer;min-height:48px;font-size:17px}
.nav button:hover,.sitem:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.nav svg{width:22px;height:22px;flex:none}
.badge{margin-left:auto;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.nav button[aria-current="page"] .badge{background:var(--accent-ink);color:var(--accent)}
.shead{margin:18px 12px 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.shead .te{text-transform:none;letter-spacing:0;font-size:14px}
.sitem{font-size:16px;padding:8px 10px;min-height:44px}
.sitem .nmS{min-width:0;flex:1;line-height:1.3}
.sitem[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.st{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.st.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st.now{border-color:var(--mark);color:var(--mark)}
.st svg{width:14px;height:14px}
.sprog{height:8px;border-radius:8px;background:var(--sunk);margin:4px 12px 8px;overflow:hidden}
.sprog i{display:block;height:100%;background:var(--accent);border-radius:8px}

/* main */
.main{min-width:0;padding-inline:16px;padding-block:22px 64px}
.wrap{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.wrap>*{min-width:0}
h1{margin:0;font-size:clamp(26px,4.6vw,34px);line-height:1.2}
.lead{margin:0;color:var(--muted);font-size:17px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.stat,.card,.day{min-width:0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.safety{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:14px 16px;border:2px solid color-mix(in srgb,var(--warn-ink) 35%,transparent);display:grid;gap:6px}
.safety p{margin:0;font-size:18px}
.safety h3{margin:0;font-size:19px;display:flex;align-items:center;gap:8px;color:var(--warn-ink)}
.safety h3 svg{width:24px;height:24px;flex:none}
.phead2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.purpose{font-size:19px;margin:8px 0 0;max-width:62ch}
.purpose b{color:var(--accent)}
.pbar{position:sticky;top:var(--topH,64px);z-index:15;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
@media (max-width:700px){.pbar{top:0;gap:8px}.pbar .ghost span{display:none}.pbar .ghost{padding:9px 12px}.pbar .stag{flex-basis:100%;text-align:center}.pbar .counter>span:first-child{display:none}.pbar .primary{padding:10px 16px;min-height:52px;font-size:18px}.pbar .sp{display:none}}
.pbar .counter{margin-left:0}
.pbar .sp{flex:1}
.safety .en2{color:inherit;opacity:.8}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 24px;min-height:58px;font-size:20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px;max-width:100%;text-align:left}
.primary svg,.ghost svg{width:22px;height:22px;flex:none}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px;min-height:48px;cursor:pointer;font-size:17px;display:inline-flex;align-items:center;gap:8px;max-width:100%;text-align:left}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;cursor:pointer;min-height:46px;font-size:17px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.flabel{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:84px}
.flabel .te{text-transform:none;letter-spacing:0;font-size:14px}
.pill{padding:3px 10px;border-radius:999px;font-weight:700;font-size:14px}
.pill.easy{background:var(--accent-soft);color:var(--accent)}
.pill.mod{background:var(--warn-bg);color:var(--warn-ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:15px;color:var(--muted)}
.time{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;color:var(--muted)}
.time svg{width:16px;height:16px}
.done1{color:var(--accent);font-weight:700}

/* plan list */
.plist{list-style:none;margin:0;padding:0;display:grid}
.plist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist .part{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.plist .part .te{text-transform:none;letter-spacing:0;font-size:13px}
.plist button.nmB{border:0;background:none;text-align:left;padding:0;cursor:pointer;font-size:18px;font-weight:700;line-height:1.3}
.rtag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:700;margin-left:6px;vertical-align:middle}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:2px solid var(--ink);margin-top:4px;font-weight:700}
.tot b{font-size:24px;font-variant-numeric:tabular-nums}

/* library grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.xcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.xcard .open{display:grid;gap:8px;width:100%;text-align:left;background:none;border:0;padding:12px;cursor:pointer;border-radius:16px}
.xcard .open:hover .thumb{background:var(--accent-soft)}
.thumb{display:block;width:100%;height:auto;background:var(--sunk);border-radius:12px}
.nm{font-size:19px;font-weight:700;line-height:1.3;padding-right:36px}
.nm .te{font-weight:600}
.star{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--fig-far)}
.star svg{width:26px;height:26px}
.star[aria-pressed="true"]{color:var(--mark)}
.star[aria-pressed="true"] path{fill:currentColor}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted)}

/* week */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.day.today{border:2px solid var(--accent)}
.day h3{margin:0;font-size:20px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.day .focus{color:var(--accent);font-weight:700;font-size:16px}
.day ol{margin:0;padding-left:22px;display:grid;gap:4px;font-size:16px}
.linkB{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.day ol li span.m{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.daytot{font-weight:700;font-variant-numeric:tabular-nums}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .k{font-size:14px;color:var(--muted)}
.stat .v{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .v small{font-size:16px;color:var(--muted);font-weight:400}
.calhead{max-width:560px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.calhead h3{margin:0;font-size:22px}
.cal{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:13px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;display:grid;align-content:space-between;justify-items:start;padding:6px;font-variant-numeric:tabular-nums;min-width:0}
.cal button .dn{font-size:15px}
.cal button .cn{justify-self:end;font-size:14px;font-weight:700;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px}
.cal button.l1 .cn{background:var(--accent-soft);color:var(--accent)}
.cal button.l2 .cn{background:var(--accent-mid);color:var(--ink)}
.cal button.l3 .cn{background:var(--accent);color:var(--accent-ink)}
.cal button.today{border:2px solid var(--ink)}
.cal button[aria-pressed="true"]{outline:3px solid var(--mark);outline-offset:1px}
.cal button.blank{visibility:hidden}
.cal button.future{opacity:.5}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dlist li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px;font-size:17px}
.dlist li:first-child{border-top:0;padding-top:0}
.dlist .r{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
textarea.copybox{width:100%;min-height:140px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}

/* figure */
svg.fig line{stroke-linecap:round}
line.near{stroke:var(--fig)} line.far{stroke:var(--fig-far)} line.fo{stroke:var(--mark)}
circle.near{fill:var(--fig)} circle.far{fill:var(--fig-far)} circle.fo{fill:var(--mark)}
path.tor.near{fill:var(--fig);stroke:var(--fig)} path.tor.fo{fill:var(--mark);stroke:var(--mark)}
circle.head{fill:var(--surface);stroke:var(--fig)} circle.head.fo{stroke:var(--mark)}
circle.dot{fill:var(--fig)} path.mouth{fill:none;stroke:var(--fig);stroke-width:2;stroke-linecap:round}
.prop{fill:var(--prop)} .prop2{fill:var(--prop2)} .floor{fill:var(--prop2)}

/* player */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stag{font-size:15px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:999px}
.dnav{display:flex;gap:8px;flex-wrap:wrap}
.phead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.phead h2{margin:0;font-size:clamp(26px,4vw,34px);line-height:1.25}
.phead .star{position:static;flex:none}
.dgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:1100px){.dgrid{grid-template-columns:1fr;gap:20px}}
.stagecol{display:grid;gap:12px;min-width:0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px 8px;position:relative;overflow:hidden}
.cue{text-align:center;font-size:26px;font-weight:700;min-height:2.7em;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.cue .te{font-weight:700}
.cue .en2{font-size:.62em}
.breath{text-align:center;font-size:16px;color:var(--muted);min-height:1.6em;margin-top:-2px}
.breath .te{font-size:17px}
.listen{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 16px}
.listen h3{margin:0 0 4px;font-size:17px;color:var(--accent)}
.listen p{margin:0}
.demo{position:absolute;left:12px;bottom:12px;font-size:13px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:999px;padding:3px 10px}
.demo .te{font-size:14px}
#fig{display:block;width:100%;height:auto;max-height:50vh}
.over{position:absolute;inset:0;background:var(--surface);display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:18px}
.over h3{margin:0;font-size:28px}
.over .big{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.over .nx{font-size:18px;color:var(--muted);max-width:44ch}
.over .nx b{color:var(--ink)}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.counter{margin-left:auto;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;font-size:17px;color:var(--muted)}
.counter b{font-size:34px;color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;gap:8px}
.panel label{font-size:17px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:28px;font-weight:700;cursor:pointer;line-height:1}
.stepper output{min-width:48px;text-align:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.ticks{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.note{margin:0;font-size:15px;color:var(--warn-ink);background:var(--warn-bg);padding:10px 12px;border-radius:10px}
.textcol{min-width:0}
.textcol h3{margin:22px 0 6px;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.textcol h3 .te{letter-spacing:0;text-transform:none;font-size:17px}
.textcol h3 .en2{display:inline;margin-left:8px;font-size:12px}
.textcol p{margin:0;font-size:19px;max-width:62ch}
.steps{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;font-size:19px}
.steps li::before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px}
.blist{list-style:none;margin:6px 0 10px;padding:0;display:grid;gap:6px;font-size:19px}
.care{margin-top:20px;background:var(--warn-bg);border-radius:14px;padding:12px 14px;color:var(--warn-ink)}
.care h3{margin-top:0!important;color:var(--warn-ink)!important}
.care .en2{color:inherit;opacity:.8}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px}
.search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.search input{border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);width:100%;min-width:0;padding:10px 0;outline:none}
.search:focus-within{outline:3px solid var(--mark);outline-offset:1px}
.side .search{margin:0 4px 12px}
.notes textarea{width:100%;min-height:110px;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);resize:vertical}
.notes .row{justify-content:space-between}
.nlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.nlist li{border-top:1px solid var(--line);padding-top:10px}
.nlist li:first-child{border-top:0;padding-top:0}
.nlist .when{font-size:14px;color:var(--muted)}
.nlist p{margin:4px 0 0;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-size:16px;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

const vec=(a,l=1)=>[Math.sin(a*D)*l,Math.cos(a*D)*l];

};
function ik(ox,oy,tx,ty,l1,l2,sign){
 const dx=tx-ox,dy=ty-oy;
 const d=Math.min(Math.max(Math.hypot(dx,dy),Math.abs(l1-l2)+.01),l1+l2-.01);
 const base=Math.atan2(dx,dy)/D;
 const alpha=Math.acos(Math.min(1,Math.max(-1,(l1*l1+d*d-l2*l2)/(2*l1*d))))/D;
 const a1=base+sign*alpha;
 const e=[ox+Math.sin(a1*D)*l1,oy+Math.cos(a1*D)*l1];
 return [a1,Math.atan2(tx-e[0],ty-e[1])/D];
}
function skel(p,sc,anchor){
 const front=sc.view==='front',ts=sc.ts||1;
 const R=vec(p.torso-90),T=vec(p.torso);
 const hipOff=front?12:0,shOff=front?24:0;
 const mir=(s,a)=>front&&s==='F'?-a:a, sg=s=>s==='N'?1:-1;
 let hc;
 if(anchor){
  const s=anchor,sv=vec(mir(s,p['l'+s+'2']),LEN.sh),tv=vec(mir(s,p['l'+s+'1']),LEN.th*ts);
  hc=add([p.ax-sv[0]-tv[0],p.ay-sv[1]-tv[1]],R,-sg(s)*hipOff);
 } else hc=[p.hx,p.hy];
 const neck=add(hc,T,LEN.torso);
 const shC=add(neck,T,-(front?6:4)+(p.shrug||0));
 const k={front,hc,neck,sh:{},hip:{},el:{},wr:{},hA:{},kn:{},an:{},toe:{}};
 for(const s of ['F','N']){
  const sh=add(shC,R,sg(s)*shOff),hp=add(hc,R,sg(s)*hipOff);
  k.sh[s]=sh;k.hip[s]=hp;
  let a1,a2;const tx=p['tA'+s+'x'],ty=p['tA'+s+'y'];
  if(tx!=null)[a1,a2]=ik(sh[0],sh[1],tx,ty,LEN.ua,LEN.fa,(front&&s==='F')?1:-1);
  else{a1=mir(s,p['a'+s+'1']);a2=mir(s,p['a'+s+'2']);}
  k.el[s]=add(sh,vec(a1),LEN.ua);k.wr[s]=add(k.el[s],vec(a2),LEN.fa);
  k.hA[s]=p['h'+s]!=null?mir(s,p['h'+s]):a2;
  let l1,l2;const lx=p['tL'+s+'x'],ly=p['tL'+s+'y'];
  if(lx!=null)[l1,l2]=ik(hp[0],hp[1],lx,ly,LEN.th*ts,LEN.sh,(front&&s==='F')?-1:1);
  else{l1=mir(s,p['l'+s+'1']);l2=mir(s,p['l'+s+'2']);}
  k.kn[s]=add(hp,vec(l1),LEN.th*ts);k.an[s]=add(k.kn[s],vec(l2),LEN.sh);
  k.toe[s]=add(k.an[s],vec(mir(s,p['f'+s])),front?9:LEN.ft);
 }
 k.hd=p.torso+(p.head||0);
 k.neckTop=add(neck,vec(k.hd),LEN.neck);
 k.headC=add(neck,vec(k.hd),LEN.neck+LEN.head);
 return k;
}
const n1=v=>v.toFixed(1);
const Ln=(a,b,c,w)=>`<line x1="${n1(a[0])}" y1="${n1(a[1])}" x2="${n1(b[0])}" y2="${n1(b[1])}" class="${c}" stroke-width="${w}"/>`;
const Ci=(a,r,c,extra='')=>`<circle cx="${n1(a[0])}" cy="${n1(a[1])}" r="${n1(r)}" class="${c}" ${extra}/>`;
const Pt=a=>n1(a[0])+' '+n1(a[1]);
function props(sc,ex){

 if(sc.prop==='bed')o+=R(18,150,8,fl-150)+R(24,196,282,20,'prop2')+R(24,214,282,6)+R(28,218,8,fl-218)+R(296,218,8,fl-218)+`<ellipse cx="60" cy="191" rx="30" ry="9" class="prop"/>`;
 if(ex.roll)o+=`<circle cx="224" cy="187" r="9" class="prop"/>`;

}
function figSVG(p,ex){
 const sc=SC[ex.scene],k=skel(p,sc,ex.anchor||sc.anchor),fo=ex.focus||[];
 const isF=key=>fo.some(x=>key.startsWith(x));
 const cl=(key,s)=>isF(key)?'fo':(s==='F'&&!k.front?'far':'near');
 const arm=s=>{
  let o=Ln(k.sh[s],k.el[s],cl('a'+s+'1',s),9)+Ln(k.el[s],k.wr[s],cl('a'+s+'2',s),8);
  const hA=k.hA[s],g=p.grip||0,c=cl('h'+s,s),palm=add(k.wr[s],vec(hA),4);
  if(g<.97){const len=10*(1-g)+1,sp=24*(1-g);for(const d of[-sp,0,sp])o+=Ln(palm,add(palm,vec(hA+d),len),c,3.2);}
  return o+Ci(palm,3.6+2.6*g,c);
 };
 const leg=s=>Ln(k.hip[s],k.kn[s],cl('l'+s+'1',s),10)+Ln(k.kn[s],k.an[s],cl('l'+s+'2',s),9)+Ln(k.an[s],k.toe[s],cl('f'+s,s),7);
 const head=()=>{
  const hf=isF('head');
  let o=Ln(k.neck,k.neckTop,hf?'fo':'near',7)+Ci(k.headC,15,'head'+(hf?' fo':''),'stroke-width="4"');
  if(!k.front)o+=Ci(add(add(k.headC,vec(k.hd-90),7),vec(k.hd),2),2.2,'dot');
  else{
   const e=add(k.headC,vec(k.hd),3),side=vec(k.hd-90);
   o+=Ci(add(e,side,5.5),2,'dot')+Ci(add(e,side,-5.5),2,'dot');
   const m=add(k.headC,vec(k.hd),-4),q=add(k.headC,vec(k.hd),-8);
   o+=`<path class="mouth" d="M${Pt(add(m,side,-5))} Q${Pt(q)} ${Pt(add(m,side,5))}"/>`;
  }
  return o;
 };
 let o=props(sc,ex);
 if(!k.front){
  o+=arm('F')+leg('F')+Ln(k.hc,k.neck,isF('torso')?'fo':'near',13)+head()+leg('N')+arm('N');
 } else {
  o+=`<path class="tor ${isF('torso')?'fo':'near'}" stroke-width="8" stroke-linejoin="round" d="M${Pt(k.sh.F)} L${Pt(k.sh.N)} L${Pt(k.hip.N)} L${Pt(k.hip.F)} Z"/>`;

  if(isF('shrug'))o+=Ln(k.sh.F,k.sh.N,'fo',10);
  o+=head()+arm('F')+arm('N');
 }
 return o;
}

/* ===== 5. AUDIO =====
   Clips: audio/<lang>-<key>.mp3, played through Web Audio. A Telugu phone voice is used instead when the phone has one,
   unless recorded family voice clips are present (store flag 'ownVoice' from the build). */
const OWN_VOICE=false;
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const AU={ctx:null,cache:new Map(),src:null,el:null,busy:false,kind:null,q:[],seq:[],seqDone:null,token:0,tts:false};
/* opened as a local file (file://): Chrome blocks fetch(), so play clips through <audio> elements instead */
let USE_EL=location.protocol==='file:';
function actx(){if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)try{AU.ctx=new C()}catch(e){}}return AU.ctx}
function wake(){const c=actx();if(c&&c.state!=='running')c.resume().catch(()=>{})}
function phoneVoice(l){
 if(OWN_VOICE||l!=='te'||!('speechSynthesis' in window))return null;
 return voices.find(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith('te'))||null;
}
function clip(l,key){
 const k=l+'-'+key,c=actx();
 if(!c)return Promise.reject(new Error('no audio'));
 if(!AU.cache.has(k))AU.cache.set(k,fetch('audio/'+k+'.mp3').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})
  .then(b=>new Promise((res,rej)=>c.decodeAudioData(b,res,rej))).catch(e=>{AU.cache.delete(k);throw e}));
 return AU.cache.get(k);
}
function stopAudio(){
 AU.token++;AU.q=[];AU.seq=[];AU.seqDone=null;AU.busy=false;AU.kind=null;
 try{AU.src&&AU.src.stop()}catch(e){}AU.src=null;
 if(AU.el){try{AU.el.onended=null;AU.el.pause()}catch(e){}AU.el=null}
 try{speechSynthesis.cancel()}catch(e){}
}
function pauseAudio(){if(AU.tts){try{speechSynthesis.pause()}catch(e){}}else if(AU.el){AU.el.pause()}else if(AU.ctx&&AU.busy)AU.ctx.suspend().catch(()=>{})}
function resumeAudio(){try{speechSynthesis.resume()}catch(e){}if(AU.el)AU.el.play().catch(()=>{});wake()}
function audioFail(){const el=$('#voiceMsg');if(el){el.innerHTML=T(UI.noAudio);el.hidden=false}}
function playEl(l,key,my,finish){
 const a=new Audio('audio/'+l+'-'+key+'.mp3');AU.el=a;
 a.onended=finish;a.onerror=()=>{if(my===AU.token){audioFail();finish()}};
 a.play().catch(()=>{if(my===AU.token){audioFail();finish()}});
}
function startClip(key,kind){
 const my=++AU.token,l=CFG.vLang,pv=phoneVoice(l);
 AU.busy=true;AU.kind=kind;AU.tts=!!pv;
 const finish=()=>{
  if(my!==AU.token)return;
  AU.busy=false;AU.src=null;
  if(AU.seq.length){startClip(AU.seq.shift(),kind);return}
  const cb=AU.seqDone;AU.seqDone=null;AU.kind=null;if(cb)cb();
  const n=AU.q.shift();if(n&&!AU.busy)startClip(n,'q');
 };
 if(pv){
  const parts=clipText(key,l).split(/(?<=[.!?:])\s+/).filter(Boolean);
  parts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.voice=pv;u.lang=pv.lang;u.rate=.85;
   if(i===parts.length-1){u.onend=finish;u.onerror=finish}speechSynthesis.speak(u)});
  return;
 }
 if(USE_EL||!actx()){playEl(l,key,my,finish);return}
 wake();
 clip(l,key).then(buf=>{
  if(my!==AU.token)return;
  const c=actx(),s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);s.onended=finish;AU.src=s;s.start();
 }).catch(()=>{if(my!==AU.token)return;USE_EL=true;playEl(l,key,my,finish)});
}
/* a sequence interrupts everything; onDone runs when it ends (or right away when sound is off) */
function saySeq(keys,onDone){
 stopAudio();
 if(!CFG.sound||!keys.length){onDone&&onDone();return}
 AU.seq=keys.slice(1);AU.seqDone=onDone||null;startClip(keys[0],'seq');
}
/* short phrase: queued behind what is playing; a newer cue replaces an older queued cue; dropped during a sequence */
function say(key){
 if(!CFG.sound)return;
 if(AU.busy){
  if(AU.kind==='seq')return;
  if(key.startsWith('cue-'))AU.q=AU.q.filter(k=>!k.startsWith('cue-'));
  AU.q.push(key);if(AU.q.length>3)AU.q.shift();return;
 }
 startClip(key,'q');
}
function preload(e){
 if(!CFG.sound||phoneVoice(CFG.vLang)||!e||USE_EL)return;
 const keys=['intro-'+e.id,'why-'+e.id,'safetyRule','listenBody','breathRule','breatheOut','breatheIn','keepBreathing','done','timesGo','eachLeg','eachSide','restNow','nextUp',...new Set(e.frames.map(f=>'cue-'+f[2]))];
 for(let i=1;i<=repsOf(e);i++)keys.push('n'+i);
 keys.forEach(k=>clip(CFG.vLang,k).catch(()=>{}));
}

/* ===== 6. ESTIMATES & WEEK PLAN ===== */
const INTRO_SEC=35;
const cycleSec=e=>e.frames.reduce((s,f)=>s+(f[3]?f[1]:f[1]/CFG.speed),0);
const estSec=e=>INTRO_SEC+repsOf(e)*cycleSec(e);
function buildPlan(di){
 const D=DAYS[di],budget=(D.light?Math.min(20,CFG.planMin):CFG.planMin)*60;
 const tot=list=>list.reduce((s,it)=>s+estSec(BYID[it.id]),0)+CFG.rest*Math.max(0,list.length-1);
 let list=[...D.warm.map(id=>({id,part:'warm'})),...D.main.map(id=>({id,part:'main'})),...D.cool.map(id=>({id,part:'cool'}))];
 while(tot(list)>budget&&list.filter(i=>i.part==='main').length>2)list.splice(list.map(i=>i.part).lastIndexOf('main'),1);
 const coolAt=()=>{const i=list.findIndex(x=>x.part==='cool');return i<0?list.length:i};
 const tryAdd=it=>{const c=list.slice();c.splice(coolAt(),0,it);if(tot(c)<=budget){list=c;return true}return false};
 if(list.filter(i=>i.part==='main').length===D.main.length){
  for(const id of D.main)if(!tryAdd({id,part:'main',round:2}))break;
  if(list.filter(i=>i.round===2).length===D.main.length&&!D.light)
   for(const id of EXTRA)if(!list.some(x=>x.id===id))tryAdd({id,part:'extra'});
 }
 return {items:list,total:tot(list),light:!!D.light};
}

 const agg={};sel.forEach(h=>{agg[h.id]=agg[h.id]||{reps:0,sets:0,sec:0};agg[h.id].reps+=h.reps;agg[h.id].sets++;agg[h.id].sec+=h.sec});
 return `<div><h1>${TI(UI.navProg)}</h1><p class="lead">${T(UI.progNote)}</p></div>
 <div><h2 style="margin:0 0 10px;font-size:20px">${TI(UI.thisWeek)}</h2><div class="stats">
  <div class="stat"><div class="k">${TI(UI.activeDays)}</div><div class="v">${s.days}<small> / 7</small></div></div>
  <div class="stat"><div class="k">${TI(UI.exDone)}</div><div class="v">${s.n}</div></div>
  <div class="stat"><div class="k">${TI(UI.minutes)}</div><div class="v">${s.mins}</div></div>
  <div class="stat"><div class="k">${TI(UI.streak)}</div><div class="v">${s.streak}</div></div></div></div>
 <div class="card"><div class="calhead"><button class="ghost" id="calPrev" aria-label="Previous month">${ICON.left}</button><h3>${TS(MON)[m]} ${y}</h3><button class="ghost" id="calNext" aria-label="Next month">${ICON.right}</button></div>
  <div class="cal">${cells}</div></div>
 <div class="card"><h3 style="margin:0 0 10px;font-size:20px">${dayLabel(V.sel)}</h3>
  ${sel.length?`<ul class="dlist">${Object.entries(agg).map(([id,a])=>`<li><span>${TI(BYID[id]?.name||{en:id,te:id})}</span><span class="r">${a.reps} ${TS(UI.times)}${a.sets>1?` (×${a.sets})`:''} · ${minTxt(a.sec)}</span></li>`).join('')}</ul>`:`<p style="margin:0;color:var(--muted)">${T(UI.noneDay)}</p>`}</div>
 <div class="card"><h3 style="margin:0 0 10px;font-size:20px">${TI(UI.allNotes)}</h3>${notesList()}</div>
 <div><h3 style="margin:0 0 8px;font-size:20px">${TI(UI.appFb)}</h3>${notesBox('app')}</div>
 <div class="row"><button class="primary" id="copyBtn">${TI(UI.copy)}</button></div>
 <div id="copyFallback" hidden><p class="note">${T(UI.copyFail)}</p><textarea class="copybox" id="copyBox" readonly></textarea></div>`;
}

/* ===== 10. PLAYER ===== */
function framePose(ex,i){return Object.assign({},SC[ex.scene].base,ex.base||{},ex.frames[i][0])}
function lerpPose(a,b,t){const o={};for(const key of new Set([...Object.keys(a),...Object.keys(b)])){const va=a[key],vb=b[key];o[key]=(typeof va==='number'&&typeof vb==='number')?va+(vb-va)*t:(va??vb)}return o}
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const segDur=fr=>Math.max(.05,fr[3]?fr[1]:fr[1]/CFG.speed);
const speedWord=()=>CFG.speed<.4?UI.vslow:CFG.speed<.8?UI.slow:UI.normal;
function introKeys(e){const k=[];if(store.get('lb_day','')!==todayK()){k.push('safetyRule','listenBody');store.set('lb_day',todayK())}if(A.whyFor!==e.id)k.push('why-'+e.id);A.whyFor=null;k.push('intro-'+e.id,'breathRule');if(e.per)k.push(e.per==='leg'?'eachLeg':'eachSide');k.push('n'+repsOf(e),'timesGo');return k}
/* with many repetitions, speak the step cues only on the first two, every fifth and the last; always speak the count */
function cueThisRep(){const n=repsOf(A.ex),r=A.reps;return n<=5||r<2||(r+1)%5===0||r===n-1}
function renderCue(){
 if(A.phase!=='ex')return;
 const fr=A.ex.frames[A.seg],c=CUE[fr[2]]||CUE.rest;
 let num='';
 if(fr[3]&&fr[1]>=1.5&&A.playing)num=` <span class="num">${Math.max(1,Math.ceil(fr[1]*(1-A.frac)))}</span>`;
 const html=L()==='en'?`<span>${c.en}${num}</span>`:L()==='te'?`<span class="te">${c.te}${num}</span>`:`<span class="te">${c.te}${num}</span><span class="en2">${c.en}</span>`;
 const el=$('#cue');if(el&&el._h!==html){el.innerHTML=html;el._h=html}
 const b=BREATH[fr[2]],bl=$('#breath');
 if(bl){const bh=b?TI(SAY[BKEY[b]]):'';if(bl._h!==bh){bl.innerHTML=bh;bl._h=bh}}
 const d=$('#demoTag');if(d)d.hidden=!A.demo;
}
function onSeg(){
 const c=A.ex.frames[A.seg][2];
 if(A.playing&&!A.demo&&c!==A.lastCue&&cueThisRep()){say('cue-'+c);if(A.reps<2&&BREATH[c])say(BKEY[BREATH[c]])}
 A.lastCue=c;
}
function setPlayBtn(){
 const b=$('#play');if(!b)return;
 const done=A.reps>=repsOf(A.ex);
 b.innerHTML=A.playing?ICON.pause+TI(UI.pause):done?ICON.again+TI(UI.again):ICON.play+TI(UI.play);
 $('#reps').textContent=A.demo?0:Math.min(A.reps,repsOf(A.ex));
 $('#repsOf').textContent=repsOf(A.ex);
}
function drawFig(){
 const svg=$('#fig');if(!svg)return;
 if(A.phase==='rest'){const nx=BYID[SESS.items[SESS.idx+1]?.id];if(nx&&svg._rest!==nx.id){svg.innerHTML=figSVG(framePose(nx,nx.thumb??1),nx);svg._rest=nx.id}return}
 svg._rest=null;
 const n=A.ex.frames.length;
 svg.innerHTML=figSVG(lerpPose(framePose(A.ex,A.seg),framePose(A.ex,(A.seg+1)%n),ease(A.frac)),A.ex);
 renderCue();
}
function startIntro(){
 A.demo=CFG.sound;A.demoEnd=false;A.reps=0;A.seg=0;A.frac=0;A.active=0;A.playing=true;A.lastCue=A.ex.frames[0][2];
 saySeq(introKeys(A.ex),()=>{A.demoEnd=true});
 setPlayBtn();
}
function finishExercise(){
 A.playing=false;A.frac=0;
 logDone(A.ex,repsOf(A.ex),A.active);
 say('done');
 if(SESS&&SESS.items[SESS.idx]?.id===A.ex.id){SESS.items[SESS.idx].done=true;saveSess()}
 setPlayBtn();renderSide();
 if(SESS&&SESS.items[SESS.idx]?.id===A.ex.id){
  clearTimeout(A.finTimer);
  A.finTimer=setTimeout(()=>{if(V.view!=='player')return;
   const nextIdx=SESS.items.findIndex((it,i)=>i>SESS.idx&&!it.done);
   if(nextIdx<0){A.phase='sdone';renderOverlay();say('sessionDone');return}
   SESS.idx=nextIdx-1;A.phase='rest';A.restLeft=CFG.rest;A.saidNext=false;say('restNow');renderOverlay();drawFig();
  },2600);
 }
}
function renderOverlay(){
 const o=$('#over');if(!o)return;
 if(A.phase==='rest'){const nx=BYID[SESS.items[SESS.idx+1].id];
  o.hidden=false;o.innerHTML=`<h3>${TI(UI.restT)}</h3><div class="big" id="restNum">${Math.ceil(A.restLeft)}</div>
   <div class="nx">${TS(UI.nextL)}: <b>${TS(nx.name)}</b><br>${TS(nx.why)}</div>
   <div class="row" style="justify-content:center"><button class="primary" id="skipRest">${ICON.play}${TI(UI.skipRest)}</button><button class="ghost" id="addRest">${TI(UI.add30)}</button></div>`;
 } else if(A.phase==='sdone'){
  o.hidden=false;o.innerHTML=`<h3>${T(UI.sessDone)}</h3><button class="primary" data-nav="progress">${ICON.chart}${TI(UI.navProg)}</button>`;
 } else o.hidden=true;
}
function tick(now){
 const dt=Math.min(.1,(now-(A.last||now))/1000);A.last=now;
 if(V.view!=='player')return;
 if(A.phase==='rest'){
  A.restLeft-=dt;
  const el=$('#restNum');if(el)el.textContent=Math.max(0,Math.ceil(A.restLeft));
  if(!A.saidNext&&A.restLeft<=Math.min(14,CFG.rest-4)){A.saidNext=true;const nid=SESS.items[SESS.idx+1].id;say('nextUp');say('why-'+nid);A.whyFor=nid;preload(BYID[nid])}
  if(A.restLeft<=0)goSession(SESS.idx+1,true);
 } else if(A.playing&&A.phase==='ex'){
  if(!A.demo)A.active+=dt;
  A.frac+=dt/segDur(A.ex.frames[A.seg]);
  while(A.frac>=1){
   A.frac-=1;A.seg++;
   if(A.seg>=A.ex.frames.length){
    A.seg=0;
    if(A.demo){if(A.demoEnd){A.demo=false;A.demoEnd=false;A.lastCue=null}}
    else{A.reps++;say('n'+Math.min(A.reps,20));if(A.reps>=repsOf(A.ex)){finishExercise();break}}
    setPlayBtn();
   }
   onSeg();
  }
 }
 drawFig();
 A.raf=requestAnimationFrame(tick);
}
function viewPlayer(){
 const e=A.ex,st=e.steps,inS=SESS&&SESS.items[SESS.idx]?.id===e.id;
 const steps=st.en.map((s,i)=>`<li><div>${T({en:s,te:st.te[i]})}</div></li>`).join('');
 const areas=e.areas.map(a=>TI(UI[a])).join(' · ');
 return `<div class="pbar">
   ${inS?`<span class="stag">${TS(UI.session)} · ${SESS.idx+1} / ${SESS.items.length}</span>`:''}
   <button class="primary" id="play"></button>
   <button class="ghost" id="restart">${ICON.again}${TI(UI.restart)}</button>
   <div class="counter"><span>${TI(UI.count)}</span><b id="reps">0</b><span>/ <span id="repsOf"></span></span></div>
   <span class="sp"></span>
   <div class="dnav"><button class="ghost" id="dPrev" aria-label="Previous exercise">${ICON.left}${TI(UI.prev)}</button><button class="ghost" id="dNext" aria-label="Next exercise">${TI(UI.next)}${ICON.right}</button></div>
 </div>
 <div class="phead"><div><h2>${T(e.name)}</h2>
  <div class="meta" style="margin-top:6px"><span class="pill ${e.level}">${TI(UI[e.level])}</span><span>${TI(UI[e.pos])}</span><span>·</span><span>${areas}</span></div>
  <p class="purpose"><b>${TI(UI.whatDoes)}:</b> ${T(e.why)}</p></div>
  <button class="star" data-fav="${e.id}" aria-pressed="${favs.has(e.id)}" aria-label="Add to My list">${ICON.star}</button></div>
 <div class="dgrid">
  <section class="stagecol">
   <div class="stage">
    <span class="demo" id="demoTag" hidden>${TI(UI.watch)}</span>
    <div class="cue" id="cue" aria-live="polite"></div>
    <div class="breath" id="breath"></div>
    <svg id="fig" class="fig" viewBox="0 0 320 266" role="img" aria-label="Moving figure showing ${e.name.en}"></svg>
    <div class="over" id="over" hidden></div>
   </div>
   <div class="panel">
    <div class="row" style="justify-content:space-between">
     <label>${TI(UI.repsL)}${e.per?` <span class="sub">(${TS(e.per==='leg'?UI.eachLegL:UI.eachSideL)})</span>`:''}</label>
     <span class="stepper"><button id="repMinus" aria-label="Fewer">−</button><output id="repVal">${repsOf(e)}</output><button id="repPlus" aria-label="More">+</button></span>
    </div>
    <div id="estLine">${timeChip(estSec(e))}</div>
   </div>
   <div class="panel">
    <label for="spd">${TI(UI.speed)}: <b id="spdLbl"></b></label>
    <input type="range" id="spd" min="0.25" max="1.25" step="0.05" value="${CFG.speed}">
    <div class="ticks"><span>${TI(UI.vslow)}</span><span>${TI(UI.normal)}</span></div>
   </div>
   <div class="panel">
    <label>${TI(UI.restBetween)}</label>
    <span class="seg" role="group" aria-label="Rest">${restSeg()}</span>
   </div>
   <div class="row"><button class="ghost" id="hearBtn" ${CFG.sound?'':'disabled'}>${ICON.son}${TI(UI.hear)}</button></div>
   <p class="note" id="voiceMsg" hidden></p>
  </section>
  <section class="textcol">
   ${safetyBox(e.tip)}
   <h3>${T(UI.how)}</h3><ol class="steps">${steps}</ol>
   <h3>${T(UI.breathing)}</h3>${breathText(e)}
   <div class="listen" style="margin-top:20px"><h3>${TI(UI.listenT)}</h3><p>${T(SAY.listenBody)}</p></div>
   <div style="margin-top:20px">${notesBox(e.id)}</div>
  </section>
 </div>`;
}
function breathText(e){
 const cues=[...new Set(e.frames.map(f=>f[2]))],by=k=>cues.filter(c=>BREATH[c]===k).map(c=>TS(CUE[c])).join(', ');
 const o=by('out'),i=by('in');
 const line=(k,list)=>list?`<li><div><b>${TS(SAY[BKEY[k]]).replace('.','')}</b> — ${list}</div></li>`:'';
 return `<ul class="blist">${line('out',o)}${line('in',i)}</ul><p>${T(SAY.breathRule)}</p>`;
}
function updateSpeedLbl(){const l=$('#spdLbl');if(l)l.innerHTML=`${TI(speedWord())} <span class="sub">(${CFG.speed.toFixed(2)}×)</span>`}
function refreshEst(){const el=$('#estLine');if(el&&A.ex)el.innerHTML=timeChip(estSec(A.ex))}
function openPlayer(id,auto=true){
 const e=BYID[id];if(!e)return;
 stopAudio();wake();preload(e);clearTimeout(A.finTimer);
 Object.assign(A,{ex:e,seg:0,frac:0,reps:0,playing:false,lastCue:null,last:0,demo:false,demoEnd:false,active:0,phase:'ex'});
 V.view='player';render();
 window.scrollTo(0,0);
 if(auto&&!reduce)startIntro();
 setPlayBtn();
 cancelAnimationFrame(A.raf);A.raf=requestAnimationFrame(tick);
}
function goSession(idx,auto){
 if(!SESS)return;
 if(idx>=SESS.items.length){A.phase='sdone';renderOverlay();return}
 SESS.idx=idx;saveSess();openPlayer(SESS.items[idx].id,auto);
}
function startSession(di=new Date().getDay()){
 if(!SESS||(SESS.day??new Date().getDay())!==di){const p=buildPlan(di);SESS={d:todayK(),day:di,items:p.items.map(it=>({...it,done:false})),idx:0};saveSess()}
 const i=SESS.items.findIndex(it=>!it.done);
 goSession(i<0?0:i,true);
}

/* ===== 11. ROUTER ===== */
function render(){
 renderTop();
 const m=$('#main');
 if(V.view!=='player'){cancelAnimationFrame(A.raf);stopAudio();clearTimeout(A.finTimer)}
 m.innerHTML=V.view==='today'?viewToday():V.view==='library'?viewLibrary():V.view==='plan'?viewPlan():V.view==='progress'?viewProgress():viewPlayer();
 if(V.view==='player'){updateSpeedLbl();setPlayBtn();renderOverlay();drawFig()}
 renderSide();
}
function go(view){V.view=view;closeMenu();render();window.scrollTo(0,0)}

/* ===== 12. EVENTS ===== */
/* installable version: offer the browser's install prompt when available */
let INSTALL_EVT=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;renderTop()});
window.addEventListener('appinstalled',()=>{INSTALL_EVT=null;renderTop()});
document.addEventListener('click',ev=>{
 if(ev.target.id==='scrim'){closeMenu();return}
 const t=ev.target.closest('button');if(!t)return;
 wake();
 if(t.id==='installBtn'&&INSTALL_EVT){INSTALL_EVT.prompt();INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;renderTop()});return}
 if(t.id==='menuBtn'){$('#side').classList.add('open');$('#scrim').classList.add('open');return}
 if(t.dataset.lang){CFG.lang=t.dataset.lang;saveCfg('lang');render();return}
 if(t.dataset.vl){CFG.vLang=t.dataset.vl;saveCfg('vLang');const wasDemo=A.demo;stopAudio();if(wasDemo)A.demoEnd=true;renderTop();if(A.ex)preload(A.ex);return}
 if(t.id==='soundBtn'){CFG.sound=!CFG.sound;saveCfg('sound');if(!CFG.sound){stopAudio();if(A.demo)A.demoEnd=true}else if(A.ex)preload(A.ex);renderTop();const h=$('#hearBtn');if(h)h.disabled=!CFG.sound;return}
 if(t.dataset.nav){go(t.dataset.nav);return}
 if(t.dataset.sidx!=null){closeMenu();goSession(+t.dataset.sidx,true);return}
 if(t.dataset.fav){const id=t.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);store.set('favs',JSON.stringify([...favs]));document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.setAttribute('aria-pressed',favs.has(id)));if(V.view==='library'&&V.lib.main==='fav')render();return}
 if(t.dataset.id){closeMenu();if(SESS){const i=SESS.items.findIndex((it,j)=>it.id===t.dataset.id&&!it.done);if(i>=0&&V.view==='today'){goSession(i,true);return}}openPlayer(t.dataset.id,true);return}
 if(t.dataset.lf){V.lib[t.dataset.lf]=t.dataset.v;render();return}
 if(t.dataset.plan){CFG.planMin=+t.dataset.plan;saveCfg('planMin');if(SESS&&!SESS.items.some(i=>i.done)){SESS=null;store.set('sess','null')}render();return}
 if(t.dataset.rest){CFG.rest=+t.dataset.rest;saveCfg('rest');if(V.view==='player'){document.querySelectorAll('[data-rest]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.rest===CFG.rest));if(A.phase==='rest')A.restLeft=Math.min(A.restLeft,CFG.rest)}else render();return}
 if(t.dataset.savenote){const k=t.dataset.savenote,ta=document.querySelector(`[data-note="${k}"]`);saveNote(k,ta.value);const w=$('#nw-'+k);if(w)w.textContent=NOTES[k]?`${TS(UI.lastSaved)}: ${fmtWhen(NOTES[k].t)}`:'';toast(UI.saved);if(V.view==='progress'){const c=document.querySelector('.nlist')?.parentElement;if(c)c.innerHTML=`<h3 style="margin:0 0 10px;font-size:20px">${TI(UI.allNotes)}</h3>${notesList()}`}return}
 if(t.id==='startSess'){startSession(SESS?.day??new Date().getDay());return}
 if(t.dataset.startday!=null){startSession(+t.dataset.startday);return}
 if(t.dataset.day){V.sel=t.dataset.day;render();return}
 if(t.id==='calPrev'||t.id==='calNext'){const c=V.cal;const d=new Date(c.y,c.m+(t.id==='calNext'?1:-1),1);V.cal={y:d.getFullYear(),m:d.getMonth()};render();return}
 if(t.id==='copyBtn'){
  const txt=summaryText(),fb=()=>{$('#copyFallback').hidden=false;const b=$('#copyBox');b.value=txt;b.focus();b.select()};
  try{navigator.clipboard.writeText(txt).then(()=>toast(UI.copied),fb)}catch(e){fb()}
  return}
 /* player */
 if(t.id==='dPrev'||t.id==='dNext'){
  const dir=t.id==='dNext'?1:-1;
  if(SESS&&SESS.items[SESS.idx]?.id===A.ex.id){const j=SESS.idx+dir;if(j>=0&&j<SESS.items.length){goSession(j,true);return}}
  const i=EX.findIndex(e=>e.id===A.ex.id);openPlayer(EX[(i+dir+EX.length)%EX.length].id,true);return}
 if(t.id==='play'){
  if(A.phase!=='ex')return;
  if(A.playing){A.playing=false;pauseAudio()}
  else if(A.reps>=repsOf(A.ex)||(A.reps===0&&A.seg===0&&A.frac===0&&!A.demo)){startIntro()}
  else{A.playing=true;if(AU.busy)resumeAudio();else{A.lastCue=null;onSeg()}}
  setPlayBtn();return}
 if(t.id==='restart'){A.phase='ex';renderOverlay();startIntro();return}
 if(t.id==='hearBtn'){saySeq(introKeys(A.ex),A.demo?()=>{A.demoEnd=true}:null);return}
 if(t.id==='repMinus'||t.id==='repPlus'){
  const n=Math.min(20,Math.max(1,repsOf(A.ex)+(t.id==='repPlus'?1:-1)));store.set('reps_'+A.ex.id,String(n));
  $('#repVal').textContent=n;setPlayBtn();refreshEst();
  if(A.playing&&!A.demo&&A.reps>=n)finishExercise();return}
 if(t.id==='skipRest'){goSession(SESS.idx+1,true);return}
 if(t.id==='addRest'){A.restLeft+=30;if(A.restLeft>16){A.saidNext=false;A.whyFor=null}return}
});
document.addEventListener('input',ev=>{
 if(ev.target.id==='libq'||ev.target.id==='sideq'){
  V.q=ev.target.value;
  if(V.view!=='library'){const pos=ev.target.selectionStart;closeMenu();go('library');const i=$('#libq');i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}return}
  const g=$('#libGrid');if(g){const tmp=document.createElement('div');tmp.innerHTML=viewLibrary();g.replaceWith(tmp.querySelector('#libGrid'))}
  const other=$(ev.target.id==='libq'?'#sideq':'#libq');if(other&&other!==ev.target)other.value=V.q;
  return}
 if(ev.target.id==='spd'){CFG.speed=parseFloat(ev.target.value);saveCfg('speed');updateSpeedLbl();refreshEst()}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape')closeMenu();
 if(V.view==='player'&&ev.key===' '&&!['BUTTON','INPUT','TEXTAREA'].includes(ev.target.tagName)){ev.preventDefault();$('#play')?.click()}
});
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--topH',$('#top').offsetHeight+'px'));
render();
</script>

if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
